<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" role="img" aria-label="What the Prediction Market Agent Atlas does">
  <defs>
    <linearGradient id="ov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#151b26"/>
    </linearGradient>
    <linearGradient id="ov-yes" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <marker id="ov-arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b7684"/>
    </marker>
  </defs>
  <style>
    .h{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,Menlo,monospace}
    .zt{font-size:13px;font-weight:700;letter-spacing:.12em;fill:#8b949e}
    .lbl{font-size:15px;fill:#e6edf3}
    .sub{font-size:12.5px;fill:#8b949e}
  </style>

  <rect width="1240" height="500" rx="14" fill="url(#ov-bg)"/>
  <text x="40" y="46" class="h" font-size="24" font-weight="700" fill="#e6edf3">Prediction Market Agent Atlas</text>
  <text x="40" y="72" class="h" font-size="15" fill="#8b949e">The safest routes from an LLM agent to a prediction market — scored, evidence-dated, rescanned weekly.</text>

  <!-- flow arrows across zones -->
  <line x1="322" y1="250" x2="372" y2="250" stroke="#6b7684" stroke-width="2" marker-end="url(#ov-arrow)"/>
  <line x1="868" y1="250" x2="918" y2="250" stroke="#6b7684" stroke-width="2" marker-end="url(#ov-arrow)"/>

  <!-- ZONE 1: who -->
  <text x="40" y="118" class="h zt">YOU BUILD WITH</text>
  <g>
    <rect x="40" y="134" width="282" height="230" rx="10" fill="#161b27" stroke="#232a38"/>
    <text x="60" y="170" class="h lbl" font-weight="600">LLM agent harness</text>
    <g class="m" font-size="13" fill="#adbac7">
      <text x="60" y="200">▸ Claude Code</text>
      <text x="60" y="226">▸ Cursor</text>
      <text x="60" y="252">▸ custom agent loop</text>
    </g>
    <text x="60" y="296" class="h sub">Needs a tool it can trust with</text>
    <text x="60" y="316" class="h sub">API keys &amp; real money.</text>
    <rect x="60" y="330" width="242" height="1" fill="#232a38"/>
    <text x="60" y="352" class="m" font-size="12.5" fill="#f0883e">? which repo do I use ?</text>
  </g>

  <!-- ZONE 2: the atlas -->
  <text x="372" y="118" class="h zt">THE ATLAS RANKS 40+ REPOS</text>
  <g>
    <rect x="372" y="134" width="496" height="230" rx="10" fill="#12233b" stroke="#1e3a5f"/>
    <!-- steps -->
    <g class="m" font-size="12.5">
      <text x="392" y="166" fill="#58a6ff">1 · scan</text>
      <text x="392" y="186" class="h sub">GitHub · PyPI · npm · archived flag</text>
      <text x="392" y="214" fill="#58a6ff">2 · score  (safety ×3, provenance · capability · agent-fit ×2)</text>
      <text x="392" y="234" class="h sub">+ maintenance computed from activity</text>
      <text x="392" y="262" fill="#58a6ff">3 · sort into tiers · flag scams &amp; dead repos</text>
    </g>
    <!-- tier ladder -->
    <g class="m" font-size="13" font-weight="700">
      <rect x="392" y="290" width="52" height="30" rx="8" fill="#16311f"/><text x="410" y="310" fill="#22c55e">S</text>
      <rect x="452" y="290" width="52" height="30" rx="8" fill="#332b12"/><text x="472" y="310" fill="#eab308">A</text>
      <rect x="512" y="290" width="52" height="30" rx="8" fill="#12233b" stroke="#1e3a5f"/><text x="531" y="310" fill="#58a6ff">B</text>
      <rect x="572" y="290" width="52" height="30" rx="8" fill="#1c222e"/><text x="591" y="310" fill="#8b949e">C</text>
      <rect x="640" y="290" width="96" height="30" rx="8" fill="#3b1214"/><text x="656" y="310" fill="#f85149">🚩 flag</text>
      <rect x="744" y="290" width="104" height="30" rx="8" fill="#21262d"/><text x="760" y="310" fill="#8b949e">🪦 dead</text>
    </g>
    <text x="392" y="346" class="h sub">Every verdict carries dated evidence — no stars-as-trust.</text>
  </g>

  <!-- ZONE 3: venues -->
  <text x="918" y="118" class="h zt">CONNECT SAFELY TO</text>
  <g>
    <rect x="918" y="134" width="282" height="230" rx="10" fill="#161b27" stroke="#232a38"/>
    <text x="938" y="170" class="h lbl" font-weight="600">Prediction markets</text>
    <g class="m" font-size="13">
      <text x="938" y="202" fill="#22c55e">◆ Kalshi</text>
      <text x="938" y="228" fill="#a371f7">◆ Polymarket</text>
      <text x="938" y="254" fill="#8b949e">◆ + more venues (extensible)</text>
    </g>
    <text x="938" y="296" class="h sub">via MCP · SDK · skill · CLI</text>
    <text x="938" y="316" class="h sub">data · orderbooks · WS · orders</text>
    <rect x="938" y="330" width="242" height="1" fill="#232a38"/>
    <!-- YES/NO tape -->
    <rect x="938" y="342" width="150" height="8" rx="4" fill="#1f2937"/>
    <rect x="938" y="342" width="98" height="8" rx="4" fill="url(#ov-yes)"/>
    <text x="1098" y="350" class="m" font-size="11" fill="#22c55e">YES 65¢</text>
  </g>

  <!-- safety footer band -->
  <rect x="40" y="396" width="1160" height="64" rx="10" fill="#161b27" stroke="#232a38"/>
  <text x="60" y="424" class="h" font-size="13" font-weight="700" letter-spacing=".08em" fill="#f0883e">SAFETY ENVELOPE</text>
  <text x="60" y="448" class="h" font-size="13" fill="#adbac7">demo / paper first  ·  keys in env, never in code  ·  gate &amp; cap every write  ·  🚩 9 scam repos blacklisted, evidence-dated</text>
</svg>
