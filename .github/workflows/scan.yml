# Weekly liveness scan: refresh live.json + the liveness as-of date,
# regenerate README, commit only on SUBSTANTIVE changes — a run where the only
# README difference is the as-of date line itself is skipped, so decay
# advances silently until it actually flips a table cell.
# (data/curated-as-of.txt is human-only; this workflow never touches it.)
#
# Notes:
# - Pushes use the built-in GITHUB_TOKEN; GitHub suppresses workflow
#   re-triggering on GITHUB_TOKEN pushes, so this cannot loop.
# - If branch protection is ever enabled on main, this push will start failing
#   silently-red — switch to a PR-creating flow at that point.
# - GitHub can auto-disable schedules in repos with no activity for ~60 days;
#   if commits go quiet for months, check the Actions tab and re-enable.
name: scan
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: Scan registries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun scripts/scan.ts
          date -u +%F > data/as-of.txt
          bun scripts/generate-readme.ts
      - name: Gate
        run: bun test && bun scripts/generate-readme.ts --check
      - name: Commit if substantively changed
        run: |
          git add data/live.json data/as-of.txt README.md
          README_SUBSTANTIVE=$(git diff --cached -U0 -- README.md \
            | grep -E '^[+-][^+-]' | grep -cv 'liveness data as of' || true)
          if git diff --cached --quiet -- data/live.json && [ "$README_SUBSTANTIVE" -eq 0 ]; then
            echo "Only the as-of date line moved — skipping commit"
          else
            git config user.name "inputoutput9"
            git config user.email "parkjames87@gmail.com"
            git commit -m "chore(scan): weekly refresh $(date -u +%F)"
            git push
          fi
